3iOPjZ04kJboxLc9SxfRHDCVFHt4DutRSGKc1Zo5i63xy9c2IuPuauWXaThsqsgWHyK7JuGHvChC1NXC9H52Cwtxk2PeEEZAZ7Z7ObhqyZ6yMT5hY+KfFAAHumEq4mZwa7abdIsElxXlzm/Se50C6G255CZ6P/mRNlckBsYFlbZ2V7XSCz0aF25n/F4Y04ms/ZlS1uqqFv/n8i3eLuMomWdwAAAABJRU5ErkJggg==", "openAnswer": null, "warning": null}, {"id": "T31-6", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 6, "topic": "T8", "topicLabel": "Cascata do Ácido Araquidônico", "question": "Um grupo de voluntários saudáveis recebeu um anti-inflamatório não esteroidal não seletivo (AINE). Após algumas horas, a análise de metabólitos plasmáticos mostrou redução acentuada de prostaglandinas (ex: PGE2) e tromboxanos (ex: TXA2), acompanhada de aumento expressivo de leucotrienos (ex: LTB4, LTC4, LTD4, LTE4). A interpretação mais adequada desse perfil bioquímico é explicada em:", "options": ["O fármaco inibe diretamente a fosfolipase A2, reduzindo a liberação de ácido araquidônico e provocando queda seletiva de prostaglandinas e tromboxanos, com consequente elevação compensatória de leucotrienos.", "O fármaco bloqueou a atividade da ciclooxigenase, diminuindo a formação de prostaglandinas e tromboxanos, o que levou ao redirecionamento do ácido araquidônico para a via da lipoxigenase, e maior síntese de leucotrienos.", "O fármaco induziu a expressão de COX-2, aumentando a conversão de ácido araquidônico em prostaglandinas e, por retroalimentação, estimulando indiretamente a produção de leucotrienos em maior quantidade.", "O fármaco aumentou a atividade da tromboxano sintase, favorecendo a utilização de prostaglandinas como substrato para TXA2, e, paralelamente, estimulando a via da lipoxigenase, o que justificaria a elevação dos leucotrienos."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-7", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 7, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "O Sr. Trombonildo Pereira, de 63 anos, portador de artrite reumatoide, foi iniciado em tratamento com celecoxibe para controle da dor articular. Após 3 meses de uso contínuo, é internado com angina instável e submetido à cinecoronariografia, que revela aterosclerose coronariana com trombo recente. Qual o mecanismo farmacológico que melhor explica o evento adverso associado ao uso do celecoxibe nesse paciente?", "options": ["Inibição seletiva da COX-2 endotelial, reduzindo a síntese de prostaciclina (PGI2), o que remove um fator antiagregante e vasodilatador, permitindo que a ação do tromboxano A2 plaquetário (derivado da COX-1) predomine, aumentando risco de eventos trombóticos.", "Inibição seletiva da COX-1 plaquetária, diminuindo a produção de tromboxano A2, o que reduz a agregação plaquetária, porém paradoxalmente aumenta risco de trombose devido ao desequilíbrio entre prostaciclina e tromboxano.", "Inibição não seletiva de COX-1 e COX-2, resultando em supressão tanto da prostaciclina (PGI2) quanto do tromboxano A2 (TXA2), causando instabilidade endotelial e promovendo vasoconstrição generalizada responsável pelo quadro isquêmico.", "Inibição seletiva da COX-2 renal, diminuindo prostaglandinas vasodilatadoras, o que gera retenção de sódio, hipertensão arterial crônica e, secundariamente, risco aumentado de aterotrombose coronariana."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-8", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 8, "topic": "T10", "topicLabel": "AINEs: Interações Medicamentosas", "question": "O Sr. Hemorrágildo Trombeta, 67 anos, portador de fibrilação atrial, faz uso crônico de varfarina para anticoagulação. Ele consulta no pronto-socorro após iniciar ácido acetilsalicílico (AAS) por conta própria, \"porque ouviu falar que faz bem para o coração\". Três dias depois, apresenta sangramento gengival persistente e fezes enegrecidas. Qual é o principal mecanismo que explica a exacerbação do risco hemorrágico nesse paciente?", "options": ["O AAS desloca a varfarina da albumina plasmática, aumentando drasticamente sua biodisponibilidade e inibindo a síntese de fibrinogênio pelo fígado.", "O AAS induz o citocromo P450, acelerando o metabolismo da varfarina, o que reduz sua eficácia e paradoxalmente aumenta o risco de trombose e sangramento simultâneo.", "O AAS reduz a atividade da vitamina K epóxido redutase no fígado, potencializando o bloqueio dessa enzima já promovido pela varfarina e levando a hipocoagulabilidade grave.", "O AAS inibe a COX-1 de forma irreversível em plaquetas, reduzindo a síntese de tromboxano A2 e comprometendo a agregação plaquetária, somando-se ao efeito anticoagulante da varfarina."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-9", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 9, "topic": "T11", "topicLabel": "Glicocorticoides: Síntese, Regulação e Farmacocinética", "question": "Um paciente em tratamento prolongado com um glicocorticoide sintético de alta potência para uma doença autoimune decide, por conta própria, descontinuar abruptamente a medicação. Sabendo da fisiologia do eixo hipotálamo-hipófise-adrenal (HHA) e da ação de feedback dos glicocorticoides, qual é a principal preocupação clínica imediata relacionada à síntese endógena de cortisol deste paciente?", "options": ["O aumento súbito e descontrolado da produção de ACTH pela hipófise, levando a um quadro de hipercortisolismo secundário.", "A hipertrofia do córtex adrenal e uma exacerbação dos sintomas da doença original devido à falta de supressão imunológica.", "A atrofia do córtex adrenal e a supressão da produção de cortisol, resultando em insuficiência adrenal.", "A produção de cortisol endógeno será rapidamente restabelecida, sem riscos, pois o organismo se adapta à ausência do medicamento."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-10", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 10, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Um paciente com artrite reumatoide crônica inicia o tratamento com glicocorticoides em dose terapêutica para controle da inflamação. O médico alerta sobre os possíveis efeitos colaterais sistêmicos e metabólicos do medicamento a longo prazo. Qual das seguintes manifestações clínicas o médico pode esperar observar no paciente devido aos efeitos metabólicos do glicocorticoide?", "options": ["Aumento da captação de glicose pelo músculo e tecido adiposo, resultando em um estado de hipoglicemia.", "Redistribuição da gordura corporal, com deposição em áreas como face e tronco, associada a uma lipólise periférica.", "Diminuição da proteólise muscular e do catabolismo proteico, promovendo o ganho de massa muscular.", "Redução da gliconeogênese hepática e da resistência à insulina, contribuindo para um melhor controle glicêmico."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-11", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 11, "topic": "T12", "topicLabel": "Glicocorticoides: Mecanismo de Ação Molecular", "question": "Um paciente de 45 anos foi submetido a transplante renal e iniciou tratamento com imunossupressores para evitar rejeição aguda. Entre os fármacos prescritos, estão incluídos glicocorticoides em altas doses intravenosas, reduzidas gradualmente para doses menores de manutenção. O residente de clínica médica é questionado sobre o motivo desse uso, considerando os mecanismos celulares desses fármacos. Qual é um dos principais mecanismos pelos quais os glicocorticoides contribuem para prevenir a rejeição do enxerto?", "options": ["Estimulam a produção de IL-2, favorecendo a proliferação de linfócitos T citotóxicos diminuindo a rejeição", "Bloqueiam a ativação do NF-kB e reduzem a síntese de citocinas pró-inflamatórias como IL-1 e IL-6.", "Aumentam a quimiotaxia de neutrófilos e monócitos, secretores de citocinas de perfil M2.", "Ativam diretamente receptores de superfície das células T, induzindo apoptose diminuindo a rejeição."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-12", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 12, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Um paciente em uso prolongado de glicocorticoides para tratamento de doença inflamatória crônica apresenta dificuldade de cicatrização de feridas e outros efeitos sistêmicos. O médico ressalta que esses achados são típicos da toxicidade induzida por esse grupo de fármacos. Quais outros efeitos adversos também estão associados ao uso extenso de glicocorticoides?", "options": ["Atraso do crescimento em crianças, osteopenia, necrose avascular e catarata.", "Hipotensão, hipoglicemia, hiperplasia adrenal e melhora da densidade óssea.", "Aumento da cicatrização tecidual, hipotireoidismo, glaucoma e maior resistência a infecções.", "Estimulação da resposta imune celular, hipertrofia muscular, hipocalcemia e diminuição da suscetibilidade a infecções."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-13", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 13, "topic": "T7", "topicLabel": "Inflamação Crônica e Granulomas", "question": "Um homem de 58 anos, tabagista há 30 anos, procura atendimento com queixa de tosse persistente, expectoração purulenta frequente e episódios recorrentes de dispneia há mais de dois anos. A biópsia brônquica evidencia infiltrado celular composto principalmente por linfócitos e macrófagos, <script>
const QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);

// Topic order (by first appearance / logical curriculum order)
const TOPIC_ORDER = ["T1","T2","T3","T4","T5","T6","T7","T8","T9","T10","T11","T12","T13"];
const EXAM_ORDER = ["T29","T30","T31","T32"];

const topicLabels = {};
const examLabels = {};
QUESTIONS.forEach(q=>{
  topicLabels[q.topic] = q.topicLabel;
  examLabels[q.exam] = q.examLabel;
});

let mode = 'topic'; // 'topic' | 'exam'
let activeTopic = TOPIC_ORDER[0];
let activeExam = EXAM_ORDER[0];

// answer state: { [questionId]: { selected: idx } }  -- for MC
// open state: { [questionId]: true } -- revealed
const state = {};
const openState = {};

function setMode(m){
  mode = m;
  document.getElementById('mode-topic-btn').classList.toggle('active', m==='topic');
  document.getElementById('mode-exam-btn').classList.toggle('active', m==='exam');
  renderTabs();
  renderActive();
}

function renderTabs(){
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  const order = mode === 'topic' ? TOPIC_ORDER : EXAM_ORDER;
  order.forEach(key=>{
    const label = mode === 'topic' ? topicLabels[key] : examLabels[key].split('—')[0].trim();
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + ((mode==='topic'?activeTopic:activeExam) === key ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => {
      if(mode==='topic'){ activeTopic = key; } else { activeExam = key; }
      renderTabs();
      renderActive();
    };
    bar.appendChild(btn);
  });
}

function getActiveQuestions(){
  if(mode === 'topic'){
    return QUESTIONS.filter(q=>q.topic === activeTopic).sort((a,b)=>{
      if(a.exam !== b.exam) return EXAM_ORDER.indexOf(a.exam) - EXAM_ORDER.indexOf(b.exam);
      return a.pos - b.pos;
    });
  } else {
    return QUESTIONS.filter(q=>q.exam === activeExam).sort((a,b)=>a.pos - b.pos);
  }
}

function isAnswered(q){
  if(q.options){ return !!state[q.id]; }
  return !!openState[q.id];
}

function isCorrect(q){
  if(q.options){ return state[q.id] && state[q.id].selected === q.correct; }
  return null; // open questions aren't auto-scored
}

function updateStatsBar(){
  const qs = getActiveQuestions();
  const total = qs.length;
  const answered = qs.filter(isAnswered).length;
  const mcQs = qs.filter(q=>q.options);
  const correct = mcQs.filter(isCorrect).length;
  const pct = total ? Math.round((answered/total)*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('stats-num').innerHTML =
    `${answered}/${total} respondidas · <b>${correct}</b> acerto${correct===1?'':'s'} de ${mcQs.length}`;
  document.getElementById('active-title').textContent =
    mode==='topic' ? topicLabels[activeTopic] : examLabels[activeExam];
}

function redoActive(){
  const qs = getActiveQuestions();
  qs.forEach(q=>{ delete state[q.id]; delete openState[q.id]; });
  renderActive();
}

function letters(n){ return "ABCDEFGH".slice(0,n).split(''); }

function renderActive(){
  updateStatsBar();
  const list = document.getElementById('question-list');
  list.innerHTML = '';
  const qs = getActiveQuestions();

  qs.forEach((q, i)=>{
    const card = document.createElement('div');
    card.className = 'qcard';

    const badgeText = mode === 'topic'
      ? examLabels[q.exam].split('—')[0].trim() + ' · Q' + q.pos
      : q.topicLabel;

    let html = `
      <div class="qcard-head">
        <span class="qnum">${i+1}.</span>
        <span class="qbadge">${escapeHtml(badgeText)}</span>
      </div>
      <div class="qtext">${escapeHtml(q.question)}</div>
    `;
    if(q.image){
      html += `<img class="qimg" src="${q.image}" alt="Imagem da questão">`;
    }
    card.innerHTML = html;

    if(q.options){
      const opts = document.createElement('div');
      opts.className = 'opts' + (state[q.id] ? ' locked' : '');
      const lett = letters(q.options.length);
      q.options.forEach((optText, idx)=>{
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt';
        b.innerHTML = `<span class="oletter">${lett[idx]})</span><span>${escapeHtml(optText)}</span>`;
        if(state[q.id]){
          if(idx === q.correct) b.classList.add('correct');
          else if(idx === state[q.id].selected) b.classList.add('wrong-picked');
          else b.classList.add('faded');
        }
        b.onclick = () => {
          if(state[q.id]) return; // locked
          state[q.id] = { selected: idx };
          renderActive();
        };
        opts.appendChild(b);
      });
      card.appendChild(opts);

      if(state[q.id]){
        const fb = document.createElement('div');
        const correct = state[q.id].selected === q.correct;
        fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
        fb.textContent = correct ? '✓ Resposta correta!' : `✗ Resposta incorreta — a correta é a letra ${lett[q.correct]}.`;
        card.appendChild(fb);
      }
    } else {
      // open question
      const oc = document.createElement('div');
      oc.className = 'open-card';
      if(!openState[q.id]){
        const btn = document.createElement('button');
        btn.className = 'reveal-btn';
        btn.textContent = 'Ver resposta esperada';
        btn.onclick = () => { openState[q.id] = true; renderActive(); };
        oc.appendChild(btn);
      } else {
        const ab = document.createElement('div');
        ab.className = 'answer-box';
        ab.style.display = 'block';
        ab.innerHTML = `<b>Resposta esperada</b>${escapeHtml(q.openAnswer)}`;
        oc.appendChild(ab);
      }
      card.appendChild(oc);
    }

    if(q.comentado && (state[q.id] || openState[q.id])){
      const cb = document.createElement('div');
      cb.className = 'comentado-box';
      cb.innerHTML = `<b>Gabarito comentado</b>${escapeHtml(q.comentado)}`;
      card.appendChild(cb);
    }

    if(q.warning && (state[q.id] || openState[q.id])){
      const wb = document.createElement('div');
      wb.className = 'warning-box';
      wb.innerHTML = `<b>⚠️ Atenção</b>${escapeHtml(q.warning)}`;
      card.appendChild(wb);
    }

    list.appendChild(card);
  });

  updateStatsBar();
}

function escapeHtml(s){
  if(s===null || s===undefined) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// init
renderTabs();
renderActive();
</script>
</body>
</html>
