<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Questões — M2 Febre &amp; Inflamação</title>
<style>
  :root{
    --bg: #f6f4ef;
    --paper: #ffffff;
    --ink: #1c2b2d;
    --ink-soft: #4c5c5e;
    --teal: #1f5f5b;
    --teal-deep: #123c3a;
    --clay: #b5562f;
    --clay-soft: #f1ddd2;
    --line: #e1ddd0;
    --ok-bg: #e5f3ea;
    --ok-ink: #1e6b3c;
    --ok-line: #7fbf95;
    --bad-bg: #fbe9e7;
    --bad-ink: #a33326;
    --bad-line: #e0a294;
    --dim: #9aa3a0;
    --radius: 10px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}

  /* Header */
  header.top{
    background:var(--teal-deep);
    color:#f3ede2;
    padding:22px 0 18px;
    border-bottom:4px solid var(--clay);
  }
  header.top .wrap{display:flex;flex-direction:column;gap:4px;}
  header.top h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    letter-spacing:.2px;
  }
  header.top p{
    margin:0;
    font-size:.85rem;
    color:#cfe3dd;
  }

  /* Mode switch */
  .mode-switch{
    display:flex;
    gap:8px;
    margin:16px 0 14px;
  }
  .mode-btn{
    flex:1;
    padding:11px 10px;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    transition:background .15s, color .15s, border-color .15s;
  }
  .mode-btn.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }

  /* Tab bar */
  .tab-bar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .tab-bar::-webkit-scrollbar{height:5px;}
  .tab-bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .tab-btn{
    flex:0 0 auto;
    padding:8px 13px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:.82rem;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  /* Stats bar */
  .stats-bar{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin:10px 0 18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .stats-bar .topic-title{
    font-family:var(--serif);
    font-size:1.02rem;
    font-weight:600;
    color:var(--teal-deep);
    flex:1 1 100%;
  }
  .progress-track{
    flex:1 1 140px;
    height:7px;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
    min-width:100px;
  }
  .progress-fill{
    height:100%;
    background:var(--teal);
    width:0%;
    transition:width .25s ease;
  }
  .stats-num{
    font-size:.82rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .stats-num b{color:var(--ink);}
  .redo-btn{
    border:1.5px solid var(--clay);
    color:var(--clay);
    background:transparent;
    border-radius:999px;
    padding:6px 12px;
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .redo-btn:hover{background:var(--clay-soft);}

  /* Question card */
  .qcard{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    margin-bottom:14px;
  }
  .qcard-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .qnum{
    font-family:var(--serif);
    font-weight:700;
    font-size:.95rem;
    color:var(--clay);
  }
  .qbadge{
    font-size:.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    background:var(--clay-soft);
    color:var(--teal-deep);
    padding:3px 8px;
    border-radius:999px;
  }
  .qtext{
    font-size:.96rem;
    white-space:pre-line;
    margin-bottom:10px;
    color:var(--ink);
  }
  .qimg{
    display:block;
    max-width:100%;
    border-radius:6px;
    border:1px solid var(--line);
    margin:8px 0 12px;
  }
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{
    display:flex;
    gap:10px;
    align-items:flex-start;
    text-align:left;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fdfcfa;
    cursor:pointer;
    font-size:.9rem;
    color:var(--ink);
    font-family:var(--sans);
  }
  .opt .oletter{
    font-weight:700;
    color:var(--teal);
    flex:0 0 auto;
  }
  .opt:hover:not(.locked .opt){border-color:var(--teal);}
  .opts.locked .opt{cursor:default;}
  .opts.locked .opt.correct{
    background:var(--ok-bg);
    border-color:var(--ok-line);
  }
  .opts.locked .opt.correct .oletter{color:var(--ok-ink);}
  .opts.locked .opt.wrong-picked{
    background:var(--bad-bg);
    border-color:var(--bad-line);
  }
  .opts.locked .opt.wrong-picked .oletter{color:var(--bad-ink);}
  .opts.locked .opt.faded{
    opacity:.45;
  }
  .feedback{
    margin-top:10px;
    font-size:.85rem;
    font-weight:700;
    padding:8px 10px;
    border-radius:8px;
  }
  .feedback.ok{background:var(--ok-bg);color:var(--ok-ink);}
  .feedback.bad{background:var(--bad-bg);color:var(--bad-ink);}
  .comentado-box{
    margin-top:10px;
    background:#f4efe3;
    border-left:4px solid var(--clay);
    padding:10px 12px;
    border-radius:6px;
    font-size:.85rem;
    color:var(--teal-deep);
  }
  .comentado-box b{display:block;margin-bottom:3px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--clay);}
  .warning-box{
    margin-top:8px;
    background:#fff6e0;
    border-left:4px solid #c9932f;
    padding:9px 11px;
    border-radius:6px;
    font-size:.82rem;
    color:#6b4f10;
  }
  .warning-box b{display:block;margin-bottom:2px;}

  /* Open answer card */
  .open-card textarea{
    width:100%;
    min-height:64px;
    border-radius:8px;
    border:1.5px solid var(--line);
    padding:10px;
    font-family:var(--sans);
    font-size:.88rem;
    resize:vertical;
  }
  .reveal-btn{
    margin-top:8px;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
  }
  .answer-box{
    margin-top:10px;
    background:var(--ok-bg);
    border-radius:8px;
    padding:10px 12px;
    font-size:.88rem;
    color:var(--ok-ink);
    display:none;
  }
  .answer-box b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;color:#2d7a4d;}

  footer.credit{
    text-align:center;
    font-size:.72rem;
    color:var(--dim);
    margin-top:30px;
    padding:0 20px;
  }

  @media (max-width:420px){
    header.top h1{font-size:1.25rem;}
    .qcard{padding:13px 12px 12px;}
  }
</style>
</head>

  <div class="wrap">
    <h1>Banco de Questões — Febre, Inflamação &amp; Farmacologia (M2)</h1>

<div class="wrap">
