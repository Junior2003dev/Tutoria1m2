 físico, observa-se sensibilidade à palpação na região abdominal inferior, além de sinais de defesa muscular. O médico suspeita de um processo inflamatório agudo. Considerando o conceito inflamação e seus estímulos desencadeadores, assinale a alternativa correta que complete a frase: A inflamação é", "options": ["Uma resposta imune específica que ocorre apenas em infecções virais, sendo mediada exclusivamente por linfócitos T.", "Caracterizada pela vasodilatação e aumento da permeabilidade vascular, sendo frequentemente iniciada por mediadores químicos como histamina e prostaglandinas.", "Crônica sempre quando for precedida por um episódio de inflamação aguda e se caracteriza pela presença exclusiva de macrófagos no tecido afetado.", "Desencadeada por estímulos limitados a agentes infecciosos, não incluindo fatores físicos ou químicos."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-7", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 7, "topic": "T5", "topicLabel": "Fases da Inflamação Aguda e Recrutamento Leucocitário", "question": "A resposta inflamatória aguda é um mecanismo essencial do sistema imunológico que visa a proteção contra lesões e infecções. Sobre os mecanismos envolvidos na resposta inflamatória aguda, assinale a alternativa correta:", "options": ["A resposta inflamatória aguda é caracterizada principalmente pela produção de anticorpos e ativação de células T no sítio da lesão, sendo a fase inicial marcada pela vasoconstrição de arteríolas.", "O processo de migração de leucócitos na resposta inflamatória aguda depende da presença de quimiocinas não envolvendo, nesta etapa, alterações no citoesqueleto das células.", "Na resposta inflamatória aguda, o aumento da permeabilidade vascular é causado exclusivamente pela morte de células endoteliais e trombose, o que ocorre predominantemente em arteríolas.", "A resposta inflamatória aguda é uma resposta rápida a lesões, infecções ou outras substâncias exógenas, marcada por três fases principais: alteração do calibre vascular, mudança estrutural na microvasculatura e migração de leucócitos para o sítio de agressão."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-8", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 8, "topic": "T5", "topicLabel": "Fases da Inflamação Aguda e Recrutamento Leucocitário", "question": "Durante a resposta inflamatória aguda, várias alterações vasculares e celulares ocorrem para facilitar o recrutamento de leucócitos e a entrega de proteínas plasmáticas ao sítio de lesão. Qual alternativa descreve corretamente as etapas envolvidas nesse processo?", "options": ["O aumento da permeabilidade vascular durante a resposta inflamatória aguda é mediado pela resposta transitória imediata, que dura cerca de 24 horas e é desencadeada por citocinas como IL-1 e TNF.", "A marginação leucocitária e a adesão firme de leucócitos às células endoteliais são determinadas pela interação de selectinas e integrinas com seus respectivos ligantes.", "A resposta inflamatória aguda é caracterizada por um aumento inicial a viscosidade sanguínea, o que acelera o fluxo de sangue e facilita o recrutamento leucocitário através da formação de exsudato, que é um ultrafiltrado do plasma.", "A lesão endotelial mediada por leucócitos é um evento secundário à resposta inflamatória aguda, ocorrendo principalmente em arteríolas e sendo responsável pelo desencadeamento da contração endotelial em vênulas pós-capilares."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-9", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 9, "topic": "T6", "topicLabel": "Efeitos Sistêmicos da Inflamação (Resposta de Fase Aguda)", "question": "Durante uma infecção viral, como o sarampo, qual alteração hematológica é mais provável de ser observada?", "options": ["Linfocitose", "Neutrofilia", "Eosinofilia", "Leucopenia"], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": "O gabarito oficial marca Linfocitose (A). Vale notar que, no sarampo especificamente, é clássica também a leucopenia com linfopenia transitória — bancas divergem sobre qual é 'a' resposta esperada para infecções virais em geral. Confira o critério usado na sua tutoria."}, {"id": "T29-10", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 10, "topic": "T8", "topicLabel": "Cascata do Ácido Araquidônico", "question": "Sebastiana de Sousa, paciente de 75 anos, com diagnóstico de artrite reumatoide, procura atendimento médico devido a um aumento significativo da dor e inflamação nas articulações. O médico explica para seu neto, estudante de medicina, que esses sintomas estão relacionados à liberação do ácido araquidônico, que é esterificado na posição sn2 dos fosfolipídios de membrana. Sabendo-se que a enzima responsável pela liberação do ácido araquidônico dos fosfolipídios é crucial para o início da cascata de eicosanoides e que diferentes isoformas dessa enzima podem ser reguladas por citocinas e fatores de crescimento. Sobre as enzimas envolvidas nessa cascata e seus principais mecanismos de regulação, analise as assertivas abaixo:\n\nI. Fosfolipase A2, responsável por hidrolisar o ácido araquidônico esterificado nos fosfolipídios da membrana, regulada por citocinas como TNF-a e IFN-y, e modulada indiretamente por glicocorticoides através da indução de lipocortinas, como a anexina I.\nII. Ciclooxigenase-1 (COX-1), que converte os fosfolipídios da membrana em ácido araquidônico, sendo regulada constitutivamente para funções fisiológicas como homeostasia vascular e função plaquetária.\nIII. Ciclooxigenase-2 (COX-2), induzida em condições inflamatórias, que converte o ácido araquidônico em prostaglandinas e tromboxanos, regulada pela cascata MAPK-PKC, e é diretamente inibida pelos glicocorticoides.\n\nÉ correto o que se afirmar em:", "options": ["Apenas uma está correta", "Apenas duas estão corretas", "Todas as alternativas estão corretas", "Todas as alternativas estão incorreta"], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": "Gabarito oficial: apenas uma correta (I). Note que II está errada (COX não gera ácido araquidônico, e sim o converte em prostaglandinas) e III também contém um erro conceitual (COX-2 não é 'diretamente inibida' pelos glicocorticoides — a inibição é indireta, via redução da transcrição/NF-kB e indução de lipocortina)."}, {"id": "T29-11", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 11, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "Os anti-inflamatórios não esteroides (AINEs) são amplamente utilizados no tratamento de condições inflamatórias e dolorosas. Sobre o mecanismo de ação e seus principais efeitos adversos marque a alternativa correta:", "options": ["Os AINEs inibem a enzima ciclooxigenase (Cox), sempre de maneira seletiva reduzindo a síntese de tromboxanos, que está diretamente relacionada com a redução da dor no processo inflamatório.", "Os AINEs bloqueiam os receptores de histamina H1, de maneira não seletiva, prevenindo a liberação de mediadores inflamatórios tendo como um dos principais efeitos adversos a nefrotoxicidade.", "Os AINEs inibem a COX, podendo ser seletivos ou não seletivos, através da redução da síntese de prostaglandinas, o que diminui a inflamação e dor, sendo a irritação gastrointestinal um dos principais efeitos adversos.", "Os AINEs bloqueiam os canais de cálcio, prevenindo a liberação de mediadores inflamatórios tendo a cardiotoxicidade como seu efeito adverso, podendo ser indicado para pacientes com risco de úlceras gástricas."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-12", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 12, "topic": "T10", "topicLabel": "AINEs: Interações Medicamentosas", "question": "Sobre as interações medicamentosas dos Anti-inflamatórios Não Esteroides (AINEs), assinale verdadeiro (V) ou falso (F) para as seguintes afirmações:\n( ) Os AINEs podem reduzir a eficácia dos diuréticos ao diminuir a perfusão renal e a filtração glomerular.\n( ) A coadministração de AINES com anticoagulantes pode aumentar o risco de sangramento devido à inibição da agregação plaquetária\n( ) Os AINEs não interferem na eficácia dos inibidores da enzima de conversão da angiotensina (IECA) usados no tratamento da hipertensão.\nA sequência correta é:", "options": ["V, V, F", "F, V, V", "V, F, F", "V, V, V"], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-13", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 13, "topic": "T11", "topicLabel": "Glicocorticoides: Síntese, Regulação e Farmacocinética", "question": "Os glicocorticoides são sintetizados nas suprarrenais sob influência do ACTH circulante secretado na adeno-hipófise e liberados de maneira pulsátil para a corrente sanguínea. Embora eles sejam continuamente liberados, existe um ritmo circadiano bem definido em sua secreção nos humanos sadios, cuja concentração sanguínea é maior durante a manhã e sofre redução gradual ao longo do dia, alcançando o ponto mais baixo à noite. Sobre a síntese, liberação e farmacocinética dos glicocorticoides, analise as assertivas abaixo:\n\nI. A secreção do próprio ACTH (também de natureza pulsátil) é regulada pelo CRF liberado pelo hipotálamo, e pelo ADH liberado pela neuro-hipófise. A liberação tanto de ACTH quanto de CRF, por sua vez, é inibida reflexamente pelo consequente aumento nas concentrações sanguíneas de glicocorticoides.\nII. Os peptídeos opioides também exercem um controle indutor na secreção de CRF, e fatores psicológicos, como reações de medo, calor ou frio excessivos, lesões ou infecções, também podem inibir a liberação de CRF. Esse é o principal mecanismo pelo qual o eixo Hipotálamo-hipófise-suprarrenal é inibido em resposta a ameaças detectadas no ambiente externo.\nIII. Os glicocorticoides endógenos são transportados no plasma ligados à globulina de ligação de corticosteroides (CBG) e albumina. Cerca de 77% da hidrocortisona plasmática estão ligados à CBG, mas muitos glicocorticoides sintéticos não estão ligados de todo. A albumina tem afinidade menor pela hidrocortisona, mas liga-se tanto aos esteroides naturais quanto aos sintéticos. A hidrocortisona tem meia-vida plasmática de 90 min, embora muitos de seus efeitos biológicos tenham uma latência de 2 a 8h.\n\nÉ correto apenas o que se afirma:", "options": ["I e II", "II e III", "I e III", "I, II e III"], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": "II está incorreta: fatores psicológicos como medo, calor/frio excessivos, lesões ou infecções ESTIMULAM (e não inibem) a liberação de CRH/ACTH — é justamente o estresse que ativa o eixo HHA."}, {"id": "T29-14", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 14, "topic": "T12", "topicLabel": "Glicocorticoides: Mecanismo de Ação Molecular", "question": "Maria Joaquina, 52 anos, apresenta um histórico de dor e inchaço nas articulações das mãos e joelhos há aproximadamente 2 anos. Ela relata rigidez matinal que dura cerca de 1 hora. A paciente foi diagnosticada com artrite reumatoide (AR) após exames laboratoriais e de imagem. Maria foi inicialmente tratada com metotrexato (MTX) 15 mg/semana e ácido fólico 5 mg/semana. No entanto, devido à persistência dos sintomas, foi necessário adicionar um glicocorticoide, prednisona: 10 mg/dia associado a metotrexato: 15 mg/semana e ácido fólico: 5 mg/semana. Após a introdução da prednisona, Maria relatou uma melhora significativa na dor e na rigidez matinal. No entanto, após 6 meses de uso contínuo de glicocorticoide, a paciente começou a apresentar efeitos colaterais. Devido aos efeitos adversos, o reumatologista decidiu iniciar um desmame gradual da prednisona, reduzindo a dose em 1 mg a cada mês, enquanto introduzia um biológico (adalimumabe) para melhor controle da doença. Sabendo que os mecanismos de ação dos glicocorticoides na regulação do fator de transcrição nuclear k (NF-kB) é um dos mecanismos mais importantes pelo qual os glicocorticoides controlam os processos inflamatórios, é correto afirmar que:", "options": ["Os efeitos se dão pela regulação do mecanismo básico de transativação. Nesse caso, presume-se que a maquinaria de transcrição NF-kB esteja operando em nível baixo. O dímero do receptor de glicocorticoide (GR), modificado pelo ligante, liga-se a um ou mais elementos de resposta a glicocorticoides \"positivos\" (GRE) dentro da sequência promotora o que estimula a transcrição desse fator.", "Os efeitos se dão pela regulação do mecanismo básico de transrepressão. A maquinaria de transcrição (TM) é constitutivamente controlada por fatores de transcrição NF-kB. Ao ligar-se ao elemento de resposta a glicocorticoides \"negativo\" (nGRE), o complexo do receptor desloca esses fatores e a expressão é reduzida.", "Os efeitos se dão pela regulação direta do mecanismo NF-kB. A transcrição normal desse fator ocorre de forma acelerada com a ligação dos fatores de transcrição NF-kB ao fator Fos/Jun e consecutivamente ao seu ponto regulatório AP-1. Esse efeito de indução da transcrição é reduzido na presença do receptor de glicocorticoides (GR).", "Os efeitos se dão pela regulação do mecanismo do NF-kB. Normalmente os fatores de transcrição (TF) P65 e P50 ligam-se ao ponto NFKB, promovendo a sua expressão gênica. Esse processo é impedido pela presença do receptor de glicocorticoide (GR), que se liga aos fatores de transcrição (TF) P65 e P50, evitando sua ação."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-15", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 15, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Analise as afirmativas e marque a opção que identifique corretamente os principais agentes glicocorticoides utilizados para tratamento sistêmico.", "options": ["Fludrocortisona e aldosterona são os principais agentes utilizados para tratamento sistêmico devido às suas propriedades anti-inflamatórias.", "Triancinolona e fludrocortisona são amplamente utilizados para tratamento sistêmico devido às suas ações metabólicas", "Cortisona e aldosterona são os principais agentes utilizados para tratamento sistêmico devido às suas propriedades imunossupressoras", "Hidrocortisona, prednisona e dexametasona são amplamente utilizados para tratamento sistêmico devido às suas potentes ações anti-inflamatórias e imunossupressoras."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-16", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 16, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Bibi, 35 anos, foi submetida a um tratamento prolongado com glicocorticoides e apresentou os seguintes sintomas: hiperglicemia, perda de massa muscular, redistribuição da gordura corporal, e sinais de osteoporose. Com base nos efeitos que melhor descreve os efeitos observados em um indivíduo em uso prolongado de glicocorticoides:", "options": ["Os glicocorticoides reduzem a captura e utilização de glicose e aumentam a gliconeogênese, levando à hiperglicemia. Eles também causam perda de massa muscular e redistribuição da gordura corporal.", "Os glicocorticoides promovem a retenção de cálcio e a redução da gliconeogênese, resultando em hipocalcemia e hipoglicemia. Eles causam aumento da massa muscular e não afetam a distribuição da gordura corporal oral.", "Os glicocorticoides aumentam a captura de glicose e reduzem a gliconeogênese, levando à hipoglicemia. Eles também causam aumento da massa muscular e não influenciam a distribuição da gordura corporal.", "Os glicocorticoides causam hiperglicemia devido a redução da gliconeogênese e aumento da captura de glicose, além de promover a formação de tecido ósseo e redistribuição da gordura corporal."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-17", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 17, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Em um episódio da série \"Grey's Anatomy\", um paciente com insuficiência adrenal apresenta uma inflamação severa após um pequeno trauma. Qual o mecanismo que melhor explica essa exacerbação inflamatória?", "options": ["Aumento nos níveis de ACTH diminuindo os níveis de corticoides endógenos.", "A falta de glicocorticoides endógenos resulta em menor controle da resposta inflamatória.", "Aumento das células T-helper do tipo Th1 e diminuição de resposta imune humoral", "Aumento da atividade dos neutrófilos e macrófagos em resposta ao aumento de IL-10."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-18", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 18, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Maria, de 55 anos, está em tratamento prolongado com glicocorticoides para uma condição inflamatória crônica. Recentemente, ela começou a apresentar sinais de hiperglicemia, osteoporose e dificuldade na cicatrização de feridas, o que levou seu médico a suspeitar de efeitos adversos relacionados ao uso prolongado deste medicamento. Com base nos principais efeitos adversos dos glicocorticoides, assinale a alternativa que melhor descreve esses efeitos:", "options": ["Os glicocorticoides aumentam a função dos osteoblastos, prevenindo o desenvolvimento de osteoporose, e a cicatrização das feridas não é afetada, mesmo com o uso prolongado.", "O uso prolongado de glicocorticoides pode causar hiperglicemia e osteoporose, além de prejudicar a cicatrização das feridas, devido à supressão do sistema imunológico e dos processos inflamatórios.", "Os glicocorticoides, em doses terapêuticas, raramente causam efeitos adversos, mesmo em pacientes com problemas ósseos ou glicêmicos.", "Os efeitos adversos dos glicocorticoides são irreversíveis, mesmo após a suspensão da terapia, com danos permanentes."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T29-19", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 19, "topic": "T6", "topicLabel": "Efeitos Sistêmicos da Inflamação (Resposta de Fase Aguda)", "question": "Durante uma consulta, um paciente com artrite reumatoide é informado de que seus níveis de proteína C reativa (PCR) estão elevados. O médico explica que isso é um sinal de inflamação sistêmica. Qual citocina é a PRINCIPAL responsável pela elevação da PCR no sangue? (questão de resposta curta)", "options": null, "correct": null, "comentado": null, "image": null, "openAnswer": "IL-6 (Interleucina-6) — é a principal indutora da síntese hepática de proteínas de fase aguda, como a PCR.", "warning": null}, {"id": "T29-20", "exam": "T29", "examLabel": "T29 — 1ª VA Tutoria M2", "pos": 20, "topic": "T4", "topicLabel": "Sinais Cardinais e Mediadores Químicos da Inflamação", "question": "Poema \"A Saga do Estudante Inflamado\" — complete as lacunas indicando o mediador responsável por cada sinal descrito:\n\n(a) ______ traz o rubor ao vasodilatar, e aumenta a permeabilidade vascular.\n(b) ______ causam febre e edema, aumentam o inchaço com seu esquema.\n(c) ______ chegou para causar: \"Sou a rainha da dor e da agonia! Faço até o mais forte pedir anestesia.\"", "options": null, "correct": null, "comentado": null, "image": null, "openAnswer": "O gabarito original da prova apenas indica \"Tabela do papel dos mediadores\" (material de aula), sem especificar por extenso as três respostas. Com base no conteúdo estudado nas demais questões desta mesma prova, uma leitura razoável é: (a) Histamina — vasodilatação e aumento da permeabilidade vascular; (b) Citocinas pirogênicas (IL-1/TNF-α) — febre e edema; (c) Bradicinina ou Prostaglandina E2 — mediador clássico da dor.", "warning": "O gabarito fornecido pela prova não especifica as respostas exatas de (a), (b) e (c), apenas remete a uma tabela do material de aula que não está no PDF. A resposta acima é uma inferência baseada no conteúdo da própria tutoria — confirme com seu professor/tabela de referência."}, {"id": "T32-1", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 1, "topic": "T1", "topicLabel": "Termorregulação e Fisiologia da Febre", "question": "Durante um plantão em unidade básica de saúde, um estudante observa que um paciente com febre apresenta inicialmente sensação de frio, seguida de aumento progressivo da temperatura corporal. Sobre os mecanismos fisiológicos envolvidos na termorregulação, assinale a alternativa correta:", "options": ["O hipotálamo atua como centro integrador térmico, processando informações provenientes de receptores sensoriais periféricos e centrais.", "Os termorreceptores periféricos, localizados na derme, são os principais deflagradores da resposta de sudorese via fibras colinérgicas.", "O aumento da temperatura corporal em resposta ao frio depende primordialmente da inibição dos centros de controle comportamental corticais.", "O hipotálamo posterior coordena os mecanismos de perda de calor, como a vasodilatação cutânea e a evaporação pelo suor."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-2", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 2, "topic": "T1", "topicLabel": "Termorregulação e Fisiologia da Febre", "question": "Um homem de 33 anos apresenta quadro febril associado a uma infecção bacteriana. O médico explica que a elevação da temperatura é mediada por citocinas que alcançam o sistema nervoso central e induzem a síntese de mediadores lipídicos no hipotálamo. Sobre a sequência de eventos que leva ao desenvolvimento da febre, é correto afirmar que:", "options": ["Pirógenos exógenos, como as endotoxinas, atravessam a barreira hematoencefálica e ligam-se diretamente aos neurônios do centro termorregulador, promovendo a febre por meio da inibição da enzima ciclooxigenase e da redução do ponto de ajuste térmico.", "Citocinas pirógenicas (IL-1 e TNF) induzem a expressão da enzima ciclooxigenase no endotélio microvascular hipotalâmico para a produção de PGE₂.", "O aumento da temperatura corporal na febre decorre da falha nos mecanismos periféricos de dissipação de calor, como a sudorese e a vasodilatação.", "A prostaglandina E₂ atua no hipotálamo posterior promovendo a redução do metabolismo basal e a vasodilatação cutânea imediata."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-3", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 3, "topic": "T2", "topicLabel": "Padrões de Febre e Febre de Origem Indeterminada", "question": "Uma paciente de 45 anos busca atendimento médico relatando episódios febris de início súbito nos últimos 15 dias. Durante a anamnese, ela descreve que os picos térmicos ultrapassam 38,5°C, mas ocorrem em horários totalmente imprevisíveis, sem periodicidade definida. Relata ainda que a duração dos episódios e o tempo de apirexia (período sem febre) variam a cada ocorrência, não sendo possível estabelecer um padrão cíclico. Baseado no caso, qual o padrão de febre?", "options": ["Ondulante.", "Recorrente.", "Irregular.", "Intermitente."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-4", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 4, "topic": "T2", "topicLabel": "Padrões de Febre e Febre de Origem Indeterminada", "question": "Uma paciente de 42 anos apresenta picos febris documentados de 38,5°C há quatro semanas. Apesar de ter passado por duas consultas ambulatoriais e uma bateria de exames laboratoriais básicos (hemograma, VHS, proteína C reativa e urocultura), a causa da febre não foi identificada. Considerando os critérios diagnósticos clássicos para Febre de Origem Indeterminada (FOI), assinale a afirmação correta:", "options": ["Exige-se temperatura superior a 38,3°C em várias ocasiões, com duração mínima de duas semanas e investigação hospitalar inconclusiva por 48 horas.", "Caracteriza-se por temperatura axilar ≥ 37,8°C por pelo menos três semanas, sem diagnóstico após uma semana de investigação hospitalar ou ambulatorial.", "Define-se por febre persistente acima de 39,0°C por dez dias, associada obrigatoriamente a sinais de falência orgânica ou alterações em exames de imagem.", "Requer temperatura matinal de 37,5°C por três semanas, independentemente da realização de exames prévios ou de internação para propedêutica."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-5", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 5, "topic": "T3", "topicLabel": "Farmacologia dos Antitérmicos", "question": "Uma criança de 6 anos apresenta febre elevada decorrente de um abscesso cutâneo com grande acúmulo de exsudato purulento. O médico discute com a família a escolha do antitérmico, considerando a eficácia da medicação em tecidos com alta atividade inflamatória. Considerando as propriedades farmacodinâmicas dos antitérmicos e o contexto clínico descrito, assinale a alternativa correta:", "options": ["O paracetamol apresenta alta eficácia anti-inflamatória em tecidos com abscessos, pois sua ação independe da concentração de peróxidos locais.", "O ácido acetilsalicílico exerce seu efeito térmico por meio do bloqueio irreversível dos receptores de histamina no sistema nervoso central.", "O paracetamol tem sua capacidade de inibir a ciclooxigenase reduzida em locais ricos em peróxidos, como no tecido purulento, limitando seu efeito periférico.", "O ácido acetilsalicílico é o fármaco de primeira escolha em quadros virais e infecciosos na pediatria devido à ausência de efeitos sistêmicos graves."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-6", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 6, "topic": "T4", "topicLabel": "Sinais Cardinais e Mediadores Químicos da Inflamação", "question": "Um paciente de 58 anos é admitido em uma unidade de emergência com quadro de infarto agudo do miocárdio. A morte celular por isquemia (necrose) libera moléculas intracelulares, denominadas Padrões Moleculares Associados ao Dano (DAMPs), que são prontamente identificadas por células sentinelas do sistema imune. Sobre os mecanismos de reconhecimento celular desses estímulos inflamatórios, assinale a alternativa correta:", "options": ["Receptores do tipo Toll (TLRs) citosólicos são os sensores primários para o reconhecimento de cristais de colesterol e ácido úrico liberados pelas células necróticas.", "O inflamassoma atua como um complexo sensor citosólico que, ao detectar DAMPs, promove o processamento enzimático da Interleucina-1 (IL-1) para sua forma ativa.", "Os receptores de reconhecimento de padrão (PRRs) estão localizados primordialmente na membrana plasmática, sendo incapazes de detectar sinais de dano no citoplasma.", "O reconhecimento de restos celulares por macrófagos sentinelas induz a secreção imediata de mediadores anti-inflamatórios para impedir a resposta tecidual aguda."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-7", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 7, "topic": "T5", "topicLabel": "Fases da Inflamação Aguda e Recrutamento Leucocitário", "question": "Uma mulher de 35 anos apresenta quadro de celulite bacteriana em membro inferior. Ao exame físico, observam-se edema, calor e rubor. Além das alterações de permeabilidade vascular, ocorre uma migração ativa de células de defesa do lúmen vascular para o interstício infectado. Sobre o processo de recrutamento leucocitário observado na fase aguda desta infecção, é correto afirmar que:", "options": ["A marginação leucocitária é facilitada pela redução da velocidade do fluxo sanguíneo (estase) decorrente da vasodilatação arteriolar.", "O rolamento dos leucócitos sobre o endotélio é mediado por integrinas de alta afinidade presentes na membrana dos macrófagos.", "A diapedese ocorre preferencialmente nas artérias de médio calibre, onde a pressão hidrostática facilita a saída dos neutrófilos.", "A quimiotaxia é um processo aleatório de migração celular que independe da presença de mediadores como o sistema complemento ou citocinas."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-8", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 8, "topic": "T7", "topicLabel": "Inflamação Crônica e Granulomas", "question": "Um homem de 42 anos, trabalhador rural, procura atendimento médico com radiografia de tórax e biópsia pulmonar em mãos, que evidencia lesões nodulares sugestivas de processo inflamatório crônico. A biópsia revela agregados organizados de macrófagos ativados, presença de células gigantes multinucleadas e área central de necrose. Com base nos exames apresentados, assinale a alternativa que melhor define granuloma e identifique corretamente seu tipo:", "options": ["Estrutura inflamatória aguda composta por neutrófilos, caracterizando granuloma supurativo.", "Organização de macrófagos ativados em resposta a estímulo persistente, caracterizando granuloma caseoso.", "Processo inflamatório mediado essencialmente por linfócitos, caracterizando granuloma não caseoso.", "Acúmulo de fibroblastos associado à cicatrização, caracterizando granuloma fibrótico."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-9", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 9, "topic": "T6", "topicLabel": "Efeitos Sistêmicos da Inflamação (Resposta de Fase Aguda)", "question": "Um homem de 52 anos é atendido em um pronto atendimento com febre há três dias, mal-estar e mialgia difusa. Os exames laboratoriais revelaram leucocitose com desvio à esquerda e elevação das proteínas de fase aguda, como Proteína C Reativa (PCR) e fibrinogênio, além de redução nos níveis de albumina sérica. Sobre a fisiopatologia da resposta sistêmica observada neste paciente, é correto afirmar que:", "options": ["A hipoalbuminemia ocorre devido à redução da síntese hepática dessa proteína, sendo a albumina classificada como uma proteína de fase aguda negativa.", "A leucocitose é mantida pela redução da taxa de produção de granulócitos na medula óssea, compensada pelo aumento da sobrevida periférica.", "A febre é desencadeada pela passagem da Proteína C Reativa pela barreira hematoencefálica e sua ligação direta a receptores hipotalâmicos.", "A síntese hepática de fibrinogênio é estimulada primariamente pela ação de citocinas pró-inflamatórias, com destaque para a interleucina-6."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-10", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 10, "topic": "T8", "topicLabel": "Cascata do Ácido Araquidônico", "question": "Uma paciente de 22 anos, com histórico de rinite alérgica, utilizou doses elevadas de um anti-inflamatório não esteroidal (AINE) durante dez dias para tratamento de uma lesão traumática no tornozelo. No décimo dia, procurou atendimento médico com queixas de dor epigástrica, episódios de dispneia e sibilância. A avaliação laboratorial evidenciou discreta elevação da creatinina sérica, sem sinais de infecção ou alterações cardiovasculares. Considerando a cascata do ácido araquidônico, as manifestações clínicas apresentadas pela paciente são explicadas pelo(a):", "options": ["Bloqueio da enzima ciclooxigenase (COX), resultando em redução de prostaglandinas protetoras e desvio do metabolismo para a via da lipoxigenase.", "Aumento compensatório da síntese de tromboxano A₂ nas plaquetas, o que promove broncoespasmo e irritação direta da mucosa gástrica.", "Inibição da fosfolipase A₂ pelo fármaco, impedindo a formação de ácido araquidônico e estimulando a liberação sistêmica de histamina.", "Ativação de mastócitos mediada por anticorpos IgE específicos, caracterizando uma reação de hipersensibilidade do tipo I ao anti-inflamatório."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-11", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 11, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "Um homem de 62 anos com osteoartrite severa e histórico de úlcera péptica recorrente necessita de tratamento anti-inflamatório. O médico opta por um inibidor seletivo da COX-2 (coxibe), mas avalia cuidadosamente o perfil cardiovascular do paciente antes da prescrição. Sobre o uso clínico dos inibidores seletivos da COX-2 nesse cenário, é correto afirmar que eles:", "options": ["São contraindicados em pacientes com alto risco gastrointestinal, pois a inibição da COX-2 aumenta a secreção ácida basal.", "Apresentam eficácia analgésica superior aos AINEs tradicionais, embora causem maior inibição da agregação plaquetária.", "Oferecem maior proteção à mucosa gástrica, mas mantêm o risco de efeitos adversos renais (edema e hipertensão) similar aos AINEs não seletivos.", "Devem ser a primeira escolha para pacientes com doença arterial coronariana prévia, devido ao seu efeito vasodilatador sistêmico."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-12", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 12, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "Um paciente de 68 anos, em uso contínuo de anti-inflamatórios não esteroidais (AINEs) para o manejo de dor articular, é atendido com queixas de epigastralgia persistente e náuseas. O médico suspeita de lesão da mucosa gástrica induzida pela medicação. Sobre a fisiopatologia das lesões gastrointestinais causadas pelo uso crônico de AINEs, é correto afirmar que elas decorrem da:", "options": ["Inibição da enzima ciclooxigenase-1 (COX-1), o que reduz a síntese de prostaglandinas citoprotetoras e favorece a agressão pelo ácido gástrico.", "Ativação direta de receptores H2 de histamina na mucosa, promovendo o aumento da secreção cloridropéptica independentemente da via das ciclooxigenases.", "Estimulação da produção de muco e bicarbonato via bloqueio da COX-2, o que gera um desequilíbrio osmótico nas células parietais do estômago.", "Redução do fluxo sanguíneo na mucosa gástrica mediada pelo aumento sistêmico de tromboxano A2, resultando em isquemia e necrose tecidual."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-13", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 13, "topic": "T6", "topicLabel": "Efeitos Sistêmicos da Inflamação (Resposta de Fase Aguda)", "question": "Um paciente de 30 anos é atendido em uma unidade de emergência apresentando um ferimento traumático infectado. Horas após, desenvolve febre, taquicardia e o hemograma revela uma leucocitose significativa com presença de formas jovens (bastonetes), caracterizando desvio à esquerda. Considerando os efeitos sistêmicos da inflamação aguda, qual alternativa explica corretamente esses achados?", "options": ["São decorrentes exclusivamente da ativação do sistema complemento, independentemente da liberação de citocinas pró-inflamatórias.", "Resultam da ação de citocinas como IL-1, TNF e IL-6, que atuam no hipotálamo, fígado e medula óssea, promovendo febre, síntese de proteínas de fase aguda e leucocitose.", "Ocorrem principalmente devido à vasodilatação local, sem participação de mediadores sistêmicos.", "São causados pela ativação direta do sistema nervoso parassimpático, levando ao aumento da temperatura corporal e da produção hepática de proteínas."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-14", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 14, "topic": "T11", "topicLabel": "Glicocorticoides: Síntese, Regulação e Farmacocinética", "question": "Um paciente com suspeita de insuficiência adrenal primária é submetido a uma investigação clínica. Durante a propedêutica, a equipe médica discute os mecanismos bioquímicos de síntese e os fatores que regulam a produção de hormônios esteroides na zona fasciculada do córtex suprarrenal. Sobre a síntese e a regulação da liberação dos glicocorticoides, é correto afirmar que:", "options": ["O colesterol é o precursor essencial e sua conversão inicial em pregnenolona, mediada pelo ACTH, constitui a etapa limitante da síntese.", "Os glicocorticoides são armazenados em grânulos de secreção citoplasmáticos, sendo liberados por exocitose após o estímulo hormonal.", "O mecanismo de feedback negativo do cortisol ocorre essencialmente no hipotálamo, inibindo a secreção do hormônio liberador de corticotropina (CRH).", "A produção de cortisol é regulada primariamente pelo sistema renina-angiotensina-aldosterona em resposta a variações na volemia sistêmica."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-15", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 15, "topic": "T12", "topicLabel": "Glicocorticoides: Mecanismo de Ação Molecular", "question": "Os glicocorticoides são fármacos lipofílicos amplamente utilizados pelo seu potente efeito anti-inflamatório. Ao atravessarem a membrana plasmática por difusão passiva, estas moléculas iniciam uma cascata de eventos intracelulares que culmina na modulação da síntese de proteínas específicas. Sobre o mecanismo de ação molecular dos glicocorticoides, assinale a alternativa que descreve corretamente a interação com o seu alvo celular:", "options": ["Ligam-se a receptores de membrana do tipo tirosinoquinase, promovendo a fosforilação imediata de proteínas citoplasmáticas.", "Atuam em receptores que residem permanentemente no núcleo celular, dissociando-os de histonas para permitir a transcrição gênica.", "Exercem o seu efeito principal no citosol, onde bloqueiam diretamente a tradução de RNA mensageiro sem necessidade de translocação nuclear.", "Interagem com receptores citoplasmáticos que, após sofrerem mudança conformacional, migram para o núcleo e ligam-se a sequências específicas do DNA."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-16", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 16, "topic": "T10", "topicLabel": "AINEs: Interações Medicamentosas", "question": "Um paciente de 68 anos, portador de fibrilação atrial crônica, faz uso regular de varfarina. Após episódio de dor torácica leve, inicia por conta própria o uso diário de ácido acetilsalicílico (AAS). Após alguns dias, apresenta epistaxe frequente e hematúria. Com base nesse caso, assinale a alternativa que melhor explica o mecanismo da interação medicamentosa observada:", "options": ["O AAS desloca a varfarina das proteínas plasmáticas e, além disso, exerce efeito antiplaquetário, potencializando o risco de sangramento.", "O AAS induz o metabolismo hepático da varfarina via CYP450, reduzindo sua depuração e aumentando seu efeito anticoagulante.", "A varfarina inibe irreversivelmente a COX-1, somando seu efeito ao do AAS na agregação plaquetária.", "O AAS reduz a absorção intestinal da varfarina, aumentando o risco hemorrágico."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-17", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 17, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "Um homem de 67 anos, com histórico de infarto do miocárdio, hipertensão e doença renal crônica moderada, procura atendimento por dor articular por osteoartrite. Ele faz uso regular de um salicilato, um antiagregante, um anti-hipertensivo e um diurético de alça, e possui histórico de sangramento digestivo alto. O paciente questiona sobre a possibilidade de iniciar um anti-inflamatório não esteroidal (AINE). Considerando o perfil clínico e as interações medicamentosas envolvidas, a conduta farmacológica correta para este paciente é:", "options": ["Prescrever um AINE não seletivo, que possui menor risco cardiovascular e não interfere no efeito antiplaquetário do AAS.", "Iniciar um inibidor seletivo da COX-2, visando à proteção da mucosa gástrica e à segurança cardiovascular no idoso.", "Contraindicar o uso de qualquer classe de AINE, devido ao risco elevado de eventos trombóticos, hemorragia digestiva e falência renal.", "Associar o AINE a um protetor de mucosa gástrica, o que garante a segurança do tratamento na presença de doença renal crônica."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-18", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 18, "topic": "T7", "topicLabel": "Inflamação Crônica e Granulomas", "question": "Um homem de 52 anos, trabalhador da construção civil, apresenta dispneia progressiva há seis meses. Relata exposição prolongada à poeira de sílica. Exames de imagem demonstram fibrose pulmonar difusa e a biópsia revela infiltrado inflamatório composto por macrófagos, linfócitos e áreas de intensa deposição de colágeno. Considerando a fisiopatologia da inflamação crônica observada neste paciente, é correto afirmar que o processo se caracteriza pela:", "options": ["Predominância de neutrófilos no sítio da lesão, responsáveis pela liberação de histamina e formação de edema exsudativo.", "Redução da atividade de fibroblastos locais, o que impede a cicatrização e favorece a destruição enzimática do parênquima.", "Formação de transudato alveolar decorrente do aumento da permeabilidade vascular nas vênulas pós-capilares.", "Ativação persistente de macrófagos, que liberam citocinas e fatores de crescimento que estimulam a fibrose."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T32-19", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 19, "topic": "T7", "topicLabel": "Inflamação Crônica e Granulomas", "question": "Um médico patologista analisa o material de uma biópsia cutânea de uma lesão nodular crônica. À microscopia, observa-se uma reação inflamatória granulomatosa caracterizada por uma parede de histiócitos, infiltrado periférico de plasmócitos e uma área central de necrose de coagulação, na qual os contornos celulares ainda são vagamente preservados. Com base no padrão histopatológico descrito, identifique: (1) o tipo de lesão, (2) o diagnóstico da doença, (3) o agente etiológico. (questão de identificação)", "options": null, "correct": null, "comentado": null, "image": null, "openAnswer": "Granuloma gomoso — Sífilis terciária — Treponema pallidum", "warning": null}, {"id": "T32-20", "exam": "T32", "examLabel": "T32 — 1ª VA Tutoria M2 (Turma XXXII)", "pos": 20, "topic": "T4", "topicLabel": "Sinais Cardinais e Mediadores Químicos da Inflamação", "question": "Um homem de 25 anos apresenta uma lesão cutânea em região pretibial após um corte acidental durante atividade doméstica há 6 horas. Ao exame físico, o local apresenta edema, calor local, rubor e o paciente queixa-se de dor intensa à palpação, dificultando a deambulação. Explique a fisiopatologia dos quatro sinais cardinais da inflamação aguda observados no paciente (rubor, calor, edema e dor), citando, para cada um, pelo menos um mediador químico envolvido no processo, não repetindo o mediador. (questão dissertativa)", "options": null, "correct": null, "comentado": null, "image": null, "openAnswer": "Rubor: Histamina • Calor: Óxido Nítrico (NO) • Edema: Bradicinina • Dor: Prostaglandina E₂ (PGE₂)", "warning": null}, {"id": "T30-1", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 1, "topic": "T1", "topicLabel": "Termorregulação e Fisiologia da Febre", "question": "Maria, uma mulher de 30 anos, apresenta febre alta (39,5°C) após ser diagnosticada com uma infecção viral. Durante a consulta, ela relata sentir calafrios intensos, mesmo em um ambiente aquecido. O médico explica que a febre é uma resposta do organismo à infecção, resultando no aumento da temperatura corporal. Maria também é orientada a aumentar a ingestão de líquidos e a usar roupas leves para ajudar na dissipação de calor.", "options": ["O aumento da temperatura corporal em resposta à infecção é uma ação de defesa do corpo, promovida pela vasodilatação periférica e aumento da produção de suor, com o intuito de combater a infecção.", "A sensação de calafrios ocorre devido à ativação do hipotálamo, que provoca uma elevação da temperatura interna ao iniciar mecanismos de conservação de calor, como vasoconstrição periférica e aumento da produção de calor por tremores.", "O controle da temperatura corporal durante a febre é realizado exclusivamente por receptores de temperatura na pele, que enviam sinais diretos para o sistema nervoso central, gerando respostas de sudorese e vasodilatação.", "A ingestão de líquidos e o uso de roupas leves não têm influência significativa na termorregulação durante a febre, uma vez que o corpo já está em um estado de aquecimento induzido pela infecção."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-2", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 2, "topic": "T1", "topicLabel": "Termorregulação e Fisiologia da Febre", "question": "Durante a avaliação de um paciente com quadro febril, o médico suspeita que a elevação da temperatura esteja relacionada a uma resposta inflamatória.", "options": ["A febre é causada por pirogênios exógenos, como as prostaglandinas, que agem diretamente sobre o centro termorregulador hipotalâmico.", "Pirogênios endógenos, como IL-1 e TNF-a, induzem a síntese de prostaglandina E2 (PGE2), elevando o ponto de ajuste da temperatura no hipotálamo.", "O ponto de ajuste hipotalâmico é reduzido durante o início da febre, causando vasodilatação e sudorese.", "Os pirogênios são produzidos exclusivamente por microrganismos invasores, e não por células do próprio organismo."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-3", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 3, "topic": "T2", "topicLabel": "Padrões de Febre e Febre de Origem Indeterminada", "question": "Roberval, 45 anos, vítima de acidente automobilístico, chega ao pronto atendimento com fratura exposta na perna direita, é internado para realização de cirurgia, porém, apresentou aumento de temperatura corporal. O procedimento é adiado pois a febre persiste há três dias associada a calafrios, cefaleia e falta de apetite. Ao exame físico, apresenta temperatura axilar de 38,7°C, pele quente e ruborizada.", "options": ["Início súbito e febre intermitente — O início súbito de febre está associado a sintomas como calafrios, e a febre intermitente caracteriza-se por períodos de hipertermia seguidos de apirexia.", "Início gradual e febre contínua — A febre de início gradual se manifesta apenas com cefaleia e inapetência, sem calafrios, e a febre contínua mantém-se sempre acima do normal, com variação menor que 1°C.", "Início súbito e febre remitente — O início súbito de febre ocorre frequentemente com calafrios, e a febre remitente apresenta variações diárias superiores a 1°C, sem períodos de apirexia.", "Início gradual e febre irregular — A febre de início gradual normalmente não apresenta calafrios, e a febre irregular caracteriza-se por picos febris não cíclicos, intercalados por períodos de temperatura normal."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-4", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 4, "topic": "T3", "topicLabel": "Farmacologia dos Antitérmicos", "question": "Um paciente de 42 anos procura atendimento médico com quadro de febre persistente há mais de dois dias, cefaleia e mialgia. No exame clínico, não há sinais de infecção evidente. Já os exames laboratoriais iniciais mostram discreta leucocitose sem desvio à esquerda. O médico prescreve um fármaco para controle da febre.", "options": ["Os antitérmicos atuam reduzindo a febre independentemente da causa, pois promovem a dissipação de calor pelo organismo, sem interferir no ponto de ajuste hipotalâmico.", "O paracetamol é um antitérmico mais eficaz do que os AINEs porque, além de reduzir a febre, também apresenta potente efeito anti-inflamatório.", "Os antitérmicos disponíveis no mercado não são exclusivamente antitérmicos, pois exercem outras ações farmacológicas, como analgesia ou ação anti-inflamatória.", "Nas febres de origem central (como lesões diretas no hipotálamo), os AINEs são os mais escolhidos, pois sua ação sobre a ciclooxigenase é suficiente para reverter a febre."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-5", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 5, "topic": "T4", "topicLabel": "Sinais Cardinais e Mediadores Químicos da Inflamação", "question": "Homem de 45 anos, previamente saudável, sofreu um trauma contuso na perna direita ao cair de bicicleta. Algumas horas após o acidente, ele percebeu dor intensa, edema e eritema local. No pronto-socorro, o exame físico revelou um hematoma extenso e uma área com aumento de temperatura, sem sinais de infecção secundária. Exames laboratoriais mostraram leucocitose com desvio à esquerda.", "options": ["A resposta inflamatória observada no paciente caracteriza-se por um predomínio de linfócitos e macrófagos, que atuam no controle imediato da fase tecidual e na reparação tecidual precoce.", "Trauma desencadeia inflamação aguda, caracterizada pela ativação de neutrófilos, vasodilatação e aumento da permeabilidade vascular, levando ao acúmulo de exsudato no tecido lesado.", "O trauma desencadeou uma resposta tecidual que ocorre sem participação de mediadores inflamatórios locais, dependendo exclusivamente da adaptação celular ao estresse físico.", "A ausência de pus no local da lesão indica que não houve uma resposta inflamatória significativa, pois toda inflamação aguda deve apresentar formação de exsudato purulento."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-6", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 6, "topic": "T5", "topicLabel": "Fases da Inflamação Aguda e Recrutamento Leucocitário", "question": "Paciente masculino de 35 anos, agricultor, residente em zona rural, apresenta história de dor lombar há 6 anos, com piora ao repouso e melhora com atividade física, associado a rigidez matinal com duração de cerca de 2 horas. Nos últimos meses, passou a relatar dificuldade progressiva na mobilidade da coluna vertebral e episódios intermitentes de vermelhidão, dor e fotofobia em olho direito. O paciente recebeu diagnóstico de Espondilite Anquilosante com manifestação extra-articular de uveíte anterior.", "options": ["As quimiocinas TNF-α e IL-1, liberadas por células imunes no sítio inflamatório, aumentam a afinidade das integrinas dos leucócitos ao seu ligante na célula endotelial.", "Após a união firme dos leucócitos às células endoteliais, ocorre reorganização do citoesqueleto do endotélio, permitindo a passagem dos leucócitos para o sítio da infecção, denominada diapedese.", "As selectinas E são moléculas de adesão expressas nas células endoteliais após ativação do endotélio pela IL-1, fator de necrose tumoral (TNF) e lipopolissacarídeo (LPS), ligam-se com alta afinidade aos leucócitos.", "Durante a fase inicial da resposta, ocorre vasodilatação, diminuição do fluxo sanguíneo e os leucócitos aproximam-se da parede dos vasos. Essas células começam uma fase de rolamento que ocorre pela interação fraca entre as selectinas do endotélio e o MHC classe I dos leucócitos."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": "Note que a alternativa B também descreve um passo real do recrutamento leucocitário (diapedese) — o gabarito oficial marca A como correta porque TNF-α/IL-1 realmente aumentam a afinidade das integrinas (ativação da adesão firme), mas vale conferir com seu tutor se a banca não aceitaria B também como correta, já que ambas descrevem etapas verdadeiras do processo."}, {"id": "T30-7", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 7, "topic": "T4", "topicLabel": "Sinais Cardinais e Mediadores Químicos da Inflamação", "question": "Um paciente relata inchaço e dor intensa no joelho direito após uma torção durante uma corrida. Ao exame físico, observa-se edema localizado, calor e dificuldade de movimentação.", "options": ["O edema resulta exclusivamente da ação da histamina, que promove vasodilatação e aumento da permeabilidade vascular, sem participação de outros mediadores.", "A bradicinina e as prostaglandinas são os principais responsáveis pelo edema, pois aumentam a permeabilidade capilar e a exsudação de líquido para o espaço intersticial.", "O óxido nítrico é o principal mediador do edema, pois atua na retenção de líquido no espaço intersticial devido à vasodilatação prolongada.", "O edema está associado à serotonina, que reduz a drenagem linfática na área lesada, acumulando líquido intersticial."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-8", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 8, "topic": "T6", "topicLabel": "Efeitos Sistêmicos da Inflamação (Resposta de Fase Aguda)", "question": "Durante a tutoria, um grupo de alunos avalia um paciente com infecção respiratória aguda. O tutor os convida a discutir os efeitos sistêmicos da inflamação aguda, suas manifestações clínicas e os principais mediadores moleculares envolvidos, conforme descrito na resposta de fase aguda.", "options": ["A febre decorre da ação direta da PGE2 sobre os microrganismos, promovendo lise celular por desnaturação térmica.", "As proteínas de fase aguda, como PCR e SAA, são produzidas no baço e contribuem para vasodilatação periférica e hipotermia.", "A leucocitose está associada ao aumento da produção de fatores de estimulação de colônias (CSF) e liberação de granulócitos pela medula óssea, podendo gerar um desvio à esquerda.", "A hepcidina, liberada pelo fígado durante a inflamação, aumenta a disponibilidade de ferro para as células da medula óssea, prevenindo anemia."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-9", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 9, "topic": "T4", "topicLabel": "Sinais Cardinais e Mediadores Químicos da Inflamação", "question": "Um trabalhador rural de 42 anos, sem comorbidades, apresenta um ferimento puntiforme no pé direito há dois dias. Ele relata dor intensa no local, acompanhada de vermelhidão, inchaço e dificuldade de apoiar o pé ao caminhar. Ao exame, observa-se aumento da temperatura local e limitação funcional. O paciente não apresenta sinais sistêmicos de infecção. Analise as afirmativas:\n\nI. A dor intensa no local da lesão está associada à liberação de bradicinina e prostaglandinas, que sensibilizam nociceptores periféricos.\nII. O aumento da temperatura e a vermelhidão são decorrentes da ação de histamina, prostaglandinas e óxido nítrico, que promovem vasodilatação e aumento do fluxo sanguíneo local.\nIII. O edema observado no paciente resulta principalmente da migração de células inflamatórias para o local da lesão, sem influência da permeabilidade vascular.\nIV. A limitação funcional pode estar relacionada tanto ao edema, que exerce pressão sobre os tecidos adjacentes, quanto à ação de mediadores inflamatórios como enzimas lisossomais e espécies reativas de oxigênio.", "options": ["I e II", "II e III", "I e III", "I, II e IV"], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-10", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 10, "topic": "T8", "topicLabel": "Cascata do Ácido Araquidônico", "question": "Paciente R.F.S., 45 anos, sexo masculino, apresenta-se com dor intensa e edema na articulação do polegar direito há 24 horas, associada a rubor e calor local. Relata histórico de episódios semelhantes nos últimos 2 anos, sempre após consumo de bebidas alcoólicas. O exame do líquido sinovial revela cristais de urato, confirmando o diagnóstico de artrite gotosa aguda.", "options": ["Leucotrienos (LTB4), produzidos pela via da 5-lipoxigenase, são os principais responsáveis pela vasodilatação e extravasamento de plasma no edema articular, enquanto as prostaglandinas (PGE2) atuam na quimiotaxia de neutrófilos.", "Prostaglandina E2 (PGE2) é o principal mediador da dor e do aumento da permeabilidade vascular, enquanto o tromboxano A2 (TXA2) promove a agregação plaquetária no sítio inflamatório.", "Lipoxinas, derivadas da via da 15-lipoxigenase, têm ação pró-inflamatória ao potencializar a produção de IL-1 por neutrófilos, amplificando a resposta aos cristais de urato.", "O ácido araquidônico livre é convertido diretamente em resolvinas pela ciclooxigenase-1 (COX-1), mediadores que iniciam a fase de reparo tecidual na inflamação aguda."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-11", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 11, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "Tony Stark sofreu um acidente durante um combate com um vilão, resultando em múltiplas fraturas e intensa dor. Para o alívio da dor e redução da inflamação, o médico da S.H.I.E.L.D. prescreveu um anti-inflamatório não esteroidal (AINE). Após alguns dias de uso do medicamento, Tony começou a apresentar sintomas como dor abdominal, náuseas e vômitos com sangue.", "options": ["Inibição irreversível da COX-2, resultando em hematêmese devido à inibição da produção de prostaglandinas.", "Inibição reversível da COX-1, resultando em gastropatia induzida por AINE, com sangramento gastrointestinal manifestado como hematêmese.", "Inibição seletiva da COX-2, resultando em nefrotoxicidade manifestada como vômitos com sangue.", "Inibição da produção de leucotrienos, resultando em dispepsia e vômitos com sangue devido à diminuição da proteção da mucosa gástrica."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-12", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 12, "topic": "T10", "topicLabel": "AINEs: Interações Medicamentosas", "question": "Um paciente de 68 anos, hipertenso e diabético, inicia tratamento com enalapril (inibidor da ECA) para controle da pressão arterial. Após um mês, devido a dores osteoarticulares, passa a usar ibuprofeno diariamente, mantendo o uso regular do enalapril. Duas semanas depois, apresenta redução do volume urinário, fadiga e aumento da creatinina sérica.", "options": ["Os AINEs reduzem a síntese de prostaglandinas vasodilatadoras, diminuindo a filtração glomerular.", "O ibuprofeno inibe diretamente a ação da ECA, reduzindo o efeito vasodilatador renal.", "O enalapril aumenta a toxicidade renal dos AINEs por indução enzimática hepática.", "Combinação de enalapril e ibuprofeno aumenta a reabsorção de sódio nos túbulos renais, causando sobrecarga de volume."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-13", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 13, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "Um paciente de 62 anos, com histórico de hipertensão arterial e infarto agudo do miocárdio há dois anos, procura atendimento devido a dores crônicas no joelho, sendo diagnosticado com osteoartrite. Ele solicita um medicamento eficaz para a dor, mas com menor risco de efeitos gastrointestinais. O médico considera prescrever um inibidor seletivo de COX-2, mas decide contraindicá-lo.", "options": ["Inibidores seletivos de COX-2 aumentam a agregação plaquetária, elevando o risco trombótico.", "Esses fármacos causam maior lesão gástrica do que os AINEs não seletivos.", "Inibidores seletivos da COX-2 bloqueiam completamente a produção de prostaglandinas, reduzindo a função renal.", "Esses fármacos são ineficazes no controle da dor osteoarticular crônica."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-14", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 14, "topic": "T12", "topicLabel": "Glicocorticoides: Mecanismo de Ação Molecular", "question": "Durante uma resposta inflamatória intensa, o organismo recorre a mecanismos endógenos para modular a inflamação, e os glicocorticoides são parte central desse controle. Além disso, medicamentos sintéticos com ação semelhante são amplamente utilizados em diversas condições clínicas.", "options": ["Os glicocorticoides são sintetizados na medula adrenal, e sua liberação ocorre de forma contínua e independente de estímulos externos.", "A farmacocinética dos glicocorticoides endógenos e sintéticos é idêntica, o que garante a mesma duração de ação para todos os fármacos dessa classe.", "Os glicocorticoides exercem seu efeito ligando-se a receptores de membrana, desencadeando resposta rápida de segundos a minutos, como os neurotransmissores.", "Os glicocorticoides atravessam a membrana celular e atuam principalmente modulando a expressão gênica, o que explica sua ação anti-inflamatória mais lenta, porém duradoura."], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-15", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 15, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Com relação aos agentes corticoides utilizados no tratamento sistêmico, analise abaixo, associando as colunas:\n1. Dexametasona\n2. Betametasona\n3. Cortisona\n4. Deflazacorte\n5. Fludrocortisona\n\nCaracterísticas:\n( ) Convertida em metabólito inativo pelas esterases plasmáticas, com utilidade semelhante à da prednisolona e meia-vida curta.\n( ) Anti-inflamatório e imunossupressor, usado especialmente em situações em que a retenção hídrica precisa ser evitada, com meia-vida longa.\n( ) Apresenta baixo custo; inativa até ser convertida em hidrocortisona; não é usada como anti-inflamatório por ter efeitos mineralocorticoides e possui meia-vida curta.\n( ) Anti-inflamatório e imunossupressor, usada especialmente em situações em que a retenção hídrica precisa ser evitada (p. ex., edema cerebral); fármaco de escolha para supressão da produção do hormônio adrenocorticotrófico, com meia-vida longa.\n( ) Fármaco de escolha pelos efeitos mineralocorticoides; possui meia-vida curta.\n\nAssinale a sequência correta:", "options": ["3 2 1 4 5", "4 2 3 1 5", "2 3 4 5 1", "5 4 3 2 1"], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-16", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 16, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Um paciente de 58 anos, com artrite reumatoide de longa data, é atendido na emergência com queixa de fraqueza muscular progressiva, dor óssea e hiperglicemia. Ele relata uso contínuo de prednisona há vários anos, sem acompanhamento médico regular. Exames laboratoriais revelam glicemia de jejum de 160 mg/dL, potássio sérico de 3,2 mEq/L (VR: 3,5-5,0 mEq/L) e densitometria óssea com T-score de -3,2.", "options": ["Supressão do eixo hipotálamo-hipófise-adrenal e resistência insulínica induzidas pelo uso crônico de glicocorticoides.", "Hipocalemia secundária à inibição da reabsorção intestinal de cálcio pela influência dos medicamentos glicocorticoides.", "Hipocalcemia causada pelo aumento da excreção de sódio induzida pelo uso crônico de fármacos glicocorticoides.", "Hipoglicemia de rebote devido à supressão adrenal e interrupção da gliconeogênese hepática como efeito dos glicocorticoides."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-17", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 17, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Um homem de 40 anos, com artrite reumatoide há cinco anos, inicia tratamento com prednisona, um glicocorticoide, devido ao agravamento dos sintomas. Após três semanas, apresenta melhora da dor e rigidez matinal, mas retorna ao consultório com fadiga persistente e lesões esbranquiçadas dolorosas na mucosa oral. O exame clínico confirma o diagnóstico de candidíase oral.", "options": ["A prednisona reduz a produção de IL-2 e TNF-α, comprometendo a ativação e proliferação de linfócitos T, o que favorece a imunossupressão e predispõe a infecções oportunistas como a candidíase oral.", "O efeito anti-inflamatório da prednisona ocorre pela inibição da IL-10 e do fator estimulador de colônias de granulócitos e macrófagos (GM-CSF), levando a um aumento compensatório da resposta imunológica inata e predispondo a infecções fúngicas.", "A estabilização das membranas lisossomais pelos glicocorticoides impede a liberação de enzimas proteolíticas e reduz a inflamação, mas leva a uma resposta hiperativa dos neutrófilos, favorecendo o crescimento da Candida na mucosa oral.", "A supressão da expressão de moléculas de MHC classe I em células apresentadoras de antígenos compromete a ativação de linfócitos CD8+, levando à redução da citotoxicidade e ao desenvolvimento da candidíase oral."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-18", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 18, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Leonilda, 52 anos, faz uso crônico de glicocorticoides e apresenta sintomas como fadiga, fraqueza muscular, osteoporose e hiperglicemia. Seu médico alertou que os glicocorticoides sintéticos são amplamente utilizados no tratamento de diversas condições inflamatórias e autoimunes, mas seu uso prolongado pode levar a efeitos adversos significativos.", "options": ["Supressão do Eixo Hipotálamo-hipófise-adrenal e estimulação da secreção de Hormônio liberador de corticotropina (CRH) resultando na secreção aumentada de CRH, Hormônio Adrenocorticotrófico (ACTH) e cortisol.", "Alterações no sistema musculoesquelético com risco menor de fraturas devido à redução da formação óssea e aumento da reabsorção óssea.", "Hiperglicemia e aumento da resistência insulínica pelo risco de precipitar diabetes em indivíduos predispostos ou agravar o controle glicêmico em pacientes com diabetes.", "Diminuição da pressão intraocular, pelo uso excessivo de glicocorticoides, aumentando o risco de desenvolvimento de catarata."], "correct": 2, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T30-19", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 19, "topic": "T2", "topicLabel": "Padrões de Febre e Febre de Origem Indeterminada", "question": "Lucas, 42 anos, apresenta febre persistente (≥ três semanas), sem diagnóstico estabelecido, apesar de múltiplas consultas médicas e exames laboratoriais. Ele relata fadiga, perda de peso e sudorese noturna. Durante a investigação, foram realizadas sorologias para doenças infecciosas, exames de imagem e hemoculturas, todos sem alterações significativas. No exame físico, observa-se linfonodomegalia discreta e hepatomegalia leve. O médico suspeita de tuberculose extrapulmonar e decide iniciar uma prova terapêutica. Cite os critérios clássicos para Febre de Origem Indeterminada (FOI) presentes neste caso. (questão de resposta curta)", "options": null, "correct": null, "comentado": null, "image": null, "openAnswer": "Febre com início há 3 semanas e 1 semana de investigação clínica sem diagnóstico.", "warning": null}, {"id": "T30-20", "exam": "T30", "examLabel": "T30 — 1ª VA Tutoria M2 (Turma XXX)", "pos": 20, "topic": "T9", "topicLabel": "AINEs: Mecanismo e Efeitos Adversos", "question": "A Dra. Leslie Thompkins, médica renomada de Gotham City, está atendendo um paciente com histórico de asma moderada, polipose nasal e dores articulares leves. O paciente relata que utilizou um medicamento para aliviar as dores articulares após consultar um colega informalmente, mas desenvolveu piora dos sintomas respiratórios, incluindo falta de ar e chiado no peito, além de congestão nasal intensa e lacrimejamento ocular. Ao investigar o histórico do paciente, Dra. Thompkins descobre que ele é sensível a medicamentos que afetam especificamente a via das prostaglandinas e leucotrienos, e que o analgésico utilizado foi descrito como \"um medicamento antigo, frequentemente usado para dores leves e disponível sem prescrição há décadas\". Qual foi o medicamento utilizado e a que classe farmacológica ele pertence? (questão de resposta curta)", "options": null, "correct": null, "comentado": null, "image": null, "openAnswer": "AAS (ácido acetilsalicílico), da classe dos salicilatos.", "warning": null}, {"id": "T31-1", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 1, "topic": "T1", "topicLabel": "Termorregulação e Fisiologia da Febre", "question": "Um homem de 32 anos foi encontrado desidratado após uma trilha em região de clima semiárido, apresentando pele quente e avermelhada, taquicardia, confusão mental e temperatura corporal de 40°C. Considerando os mecanismos fisiológicos de termorregulação, assinale a alternativa correta sobre a resposta do organismo diante da elevação da temperatura corporal.", "options": ["A vasoconstrição periférica é o principal mecanismo utilizado para dissipar calor corporal.", "O hipotálamo anterior induz a vasodilatação cutânea e sudorese para aumentar a perda de calor.", "A secreção de catecolaminas aumenta a sudorese e reduz o metabolismo basal.", "A sudorese é controlada exclusivamente pelo sistema nervoso parassimpático, sem participação do simpático."], "correct": 1, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-2", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 2, "topic": "T6", "topicLabel": "Efeitos Sistêmicos da Inflamação (Resposta de Fase Aguda)", "question": "Um paciente de 65 anos apresenta pneumonia bacteriana acompanhada de febre, taquicardia, leucocitose e níveis elevados de proteína C-reativa (PCR). Com base nos efeitos sistêmicos da inflamação aguda, assinale a alternativa correta.", "options": ["A febre decorre da ação de prostaglandinas no hipotálamo estimuladas por citocinas como IL-1 e TNF.", "A leucocitose observada na inflamação é causada exclusivamente pelo aumento da sobrevida dos leucócitos circulantes.", "A produção de proteínas de fase aguda, como a PCR, é estimulada por citocinas anti-inflamatórias.", "A taquicardia é resposta inespecífica, sem relação com o estado inflamatório."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-3", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 3, "topic": "T5", "topicLabel": "Fases da Inflamação Aguda e Recrutamento Leucocitário", "question": "Uma criança é atendida no Setor de Emergência com achados clínicos e laboratoriais sugestivos de apendicite aguda com início dos sintomas a menos de 12 horas. Exames de imagem, anamnese e histopatológico confirmam esse diagnóstico. O processo patológico observado é caracterizado principalmente por exsudação de fluídos e proteínas plasmáticas e pela migração predominante de:", "options": ["Macrófagos", "Mastócitos", "Linfócitos", "Neutrófilos"], "correct": 3, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-4", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 4, "topic": "T5", "topicLabel": "Fases da Inflamação Aguda e Recrutamento Leucocitário", "question": "O recrutamento de leucócitos e proteínas plasmáticas do sangue para o sítio da infecção ou do dano tecidual é denominado inflamação. Muitas são as alterações fisiológicas ocasionadas para o desenvolvimento do processo inflamatório agudo e tais alterações são normalmente classificadas em etapas. Com relação aos eventos responsáveis pelas etapas da resposta inflamatória aguda, assinale a alternativa correta.", "options": ["As quimiocinas liberadas no sítio inflamatório aumentam a afinidade das integrinas dos leucócitos aos seus ligantes nas células endoteliais.", "Durante a fase inicial da resposta, ocorre vasodilatação, diminuição do fluxo sanguíneo e os leucócitos aproximam-se da parede dos vasos. Essas células começam uma fase de rolamento que ocorre pela interação fraca entre as selectinas do endotélio e o MHC classe II dos fagócitos.", "Após a união firme dos leucócitos às células endoteliais, ocorre reorganização do citoesqueleto do endotélio, permitindo a passagem dos leucócitos para o sítio da infecção, denominada diapedese.", "O reconhecimento dos microrganismos ou de células mortas induz várias respostas nos leucócitos, que são denominadas ativação dos leucócitos. A ativação resulta de vias de sinalização que são desencadeadas nos leucócitos, exclusivamente pelo reconhecimento de anticorpos específicos aderidos à superfície dos microrganismos."], "correct": 0, "comentado": null, "image": null, "openAnswer": null, "warning": null}, {"id": "T31-5", "exam": "T31", "examLabel": "T31 — 1ª VA Tutoria M2 (Turma XXXI - Comissão de Formatura)", "pos": 5, "topic": "T13", "topicLabel": "Glicocorticoides: Uso Clínico e Efeitos Adversos", "question": "Socorro, 48 anos, portadora de lúpus eritematoso sistêmico (LES) em atividade, apresenta fadiga intensa, febre baixa e poliartrite simétrica. Seu histórico médico revela função renal preservada, mas episódios prévios de gastrite induzida por medicamentos. O médico responsável precisa prescrever um glicocorticoide oral e de menor risco de efeitos adversos para a paciente. Considerando as características farmacológicas dos compostos listados na tabela abaixo e o risco de efeito adverso, qual seria a opção mais adequada para Socorro:", "options": ["Cortisona", "Metilprednisolona", "Betametasona", "Aldosterona"], "correct": 1, "comentado": null, "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3oAAADmCAIAAAAMfWCKAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR42sy96XNkx3U9mJlvqQW1YAcajd6bVJOSKFmyNR7bY0d4+XP9zRMTtn/jkP3BY0uWRFEU2Ww2em8Ajb32V2/L34dTdXHrZr7qpu2YcAWDgS4UXr0l8y7nnnuu/uUv/10ppbVW85e1VilljBHvKKWUtkrZMAystVmWaa3jOFZKpWkaRVFZlmVZzj6otbXW2tIYjT/n/3e/kV5FUWptjDFaaxykLEv3r+jzRml+cPp8EARaa/c41locBD/jmFrrPM/xA/1K/JM+iXe01nS9QRAEQYDvKoqCPoAf8LEoivT8xU+VH5/uOV0vXeb88lVR5rgufmk4t7Isi6LAMbXWQRAYgyOU/KtxPnSBOI61tiiKoijDMLR2dpPN/IX7UxRFURQ4Ml2+MQbfaIzBTcBXTKdT7bzwK/onf150r+hBG2O0tsYYa2dni5PBB7IsW7wzmt8NetH3BkHgW4d4FpofCi+6jWLh8XXLX8YYeli00vC9YtnTLRLrGf8Pw5AvknL+ouPzW6S1Lgtr7fXxDXvxpUXfxc+TVinum7s+rS21UfxM6HvDMKQzxzPFl9KS5o+A7gP/E7ziqKa1Ee9ba2FY3LtN60c8Yr7vaElba+k+iG3F1wNboQaL0dqSdg1tAuwvuidKKVXaIAi10tePw9qyLPOimJ28ubZOWmtjdJ5neAriVuO58N3hnNv18sY64c+R7kaeF0
